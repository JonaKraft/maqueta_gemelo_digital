; =============================================================================
; PlatformIO Configuration - Gemelo Digital Jose
; ESP32-S3 Industrial Prototype - PackML/ISA-88 Digital Twin
; =============================================================================

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Particiones personalizadas para OTA dual + LittleFS ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- Frecuencia de CPU y Flash ---
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB

; --- PSRAM habilitado (octal si la placa lo soporta) ---
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    ; --- NeoPixel onboard del DevKitC-1 ---
    -DUSE_NEOPIXEL_LED
    ; --- Versión de firmware embebida ---
    -DVERSION_MAJOR=1
    -DVERSION_MINOR=0
    -DVERSION_PATCH=0

; --- Monitor serial ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Upload ---
upload_speed = 921600

; --- Dependencias de librerías ---
lib_deps =
    ; OLED display driver (U8g2 - mejor soporte de caracteres y scroll)
    olikraus/U8g2@^2.35.19
    ; Cliente MQTT
    knolleary/PubSubClient@^2.8
    ; JSON para payloads MQTT y config web
    bblanchon/ArduinoJson@^7.1.0
    ; NeoPixel para LED RGB direccionable (opción WS2812)
    adafruit/Adafruit NeoPixel@^1.12.3
    ; LittleFS ya incluido en el framework ESP32-Arduino 3.x
